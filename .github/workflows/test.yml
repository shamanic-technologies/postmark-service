name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres, one per run, inside the runner.
    #
    # This used to be an isolated Neon branch cut per PR. The Neon project no
    # longer exists — the fleet moved to a self-hosted Postgres — so the
    # create-branch step began failing with a 404 and nothing could merge. A
    # service container gives the same guarantee the branch was there for (never
    # a database anything else points at, discarded when the job ends) with no
    # external dependency, no API key, and no cleanup step that can leave a
    # branch behind. postgres:17 matches the version the fleet runs in production
    # (17.10), so CI validates the schema against the same major.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postmark_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify drizzle migrations exist
        run: |
          test -f drizzle/meta/_journal.json || (echo "ERROR: drizzle/meta/_journal.json missing. Run 'npm run db:generate' and commit the drizzle/ folder." && exit 1)

      - name: Run unit tests
        run: npm run test:unit

      - name: Push schema to database
        if: github.event_name == 'pull_request'
        run: npx drizzle-kit push --force
        env:
          POSTMARK_SERVICE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postmark_service_test

      - name: Run integration tests
        if: github.event_name == 'pull_request'
        run: npm run test:integration
        env:
          POSTMARK_SERVICE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postmark_service_test
          POSTMARK_SERVICE_API_KEY: test-secret-key
